# Keeps the free Supabase project from pausing (it pauses after about 7 days without activity).
# Runs every 3 days and reads one open role with the public (publishable) key – no secrets needed.
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://wlslnfgfbcanfwlbxaap.supabase.co/rest/v1/roles?select=id&limit=1" \
            -H "apikey: sb_publishable_3HcZY0wfDpm6Vdj7zOIUoA_NiltZvGL")
          echo "Supabase answered $code"
          test "$code" = "200"
